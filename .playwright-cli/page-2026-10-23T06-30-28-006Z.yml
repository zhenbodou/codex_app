          - generic [ref=f2e124]:
            - paragraph [ref=f2e125]: It includes a new sidebar for managing multiple sessions, a drag-and-drop layout for arranging your workspace, an integrated terminal and file editor, plus performance and quality-of-life improvements.
            - figure [ref=f2e126]:
              - iframe [ref=f2e128]:

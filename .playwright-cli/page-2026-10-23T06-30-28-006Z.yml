            - heading "The new desktop experience" [level=2] [ref=f2e129]
            - paragraph [ref=f2e130]: For many developers, the shape of agentic work has changed. You're not typing one prompt and waiting. You're kicking off a refactor in one repo, a bug fix in another, and a test-writing pass in a third, checking on each as results come in, steering when something drifts, and reviewing diffs before you ship.
            - paragraph [ref=f2e131]: "The new app is built for how agentic coding actually feels now: many things in flight, and you in the orchestrator seat."
            - heading "Run sessions in parallel" [level=2] [ref=f2e132]
            - paragraph [ref=f2e133]: The new sidebar puts every active and recent session in one place. Kick off work across multiple repos and move between them as results arrive.
            - paragraph [ref=f2e134]: You can filter by status, project, or environment, or group the sidebar by project to find and resume sessions faster. When a session's PR merges or closes, it archives itself so the sidebar stays focused on what's live.
            - paragraph [ref=f2e135]: When you need to ask a question mid-task, you can open a side chat (⌘ + ; or Ctrl + ;) to branch off a conversation. Side chats pull context from the main thread, but don’t add anything back to the thread, to avoid misdirecting your tasks.
            - heading "Review and ship without leaving the app" [level=2] [ref=f2e136]
            - paragraph [ref=f2e137]: "The redesign brings more commonly-used tools into the app, so you can review, tweak, and ship Claude's work without bouncing to your editor:"
            - list [ref=f2e138]:
              - listitem [ref=f2e139]:
                - strong [ref=f2e140]: Integrated terminal
                - text: ": Run tests or builds alongside your session."
              - listitem [ref=f2e141]:
                - strong [ref=f2e142]: In-app file editor
                - text: ": Open files, make spot edits directly, and save changes."
              - listitem [ref=f2e143]:
                - strong [ref=f2e144]: Faster diff viewer
                - text: ": Rebuilt for performance on large changesets."
              - listitem [ref=f2e145]:
                - strong [ref=f2e146]: Expanded preview
                - text: ": Open HTML files or PDFs in-app, in addition to running local app servers in the preview pane."
            - paragraph [ref=f2e147]: Every pane is drag-and-drop. Arrange the terminal, preview, diff viewer, and chat in whatever grid matches how you work.
            - heading "Fits your stack" [level=2] [ref=f2e148]
            - paragraph [ref=f2e149]: The desktop app now has parity with CLI plugins. If your org manages Claude Code plugins centrally, or you've installed your own locally, they work in the desktop app exactly the way they do in your terminal.
            - paragraph [ref=f2e150]: You can still run sessions locally or in the cloud. SSH support now extends to Mac alongside Linux, so you can point sessions at remote machines from either platform.
            - heading "Customize for how you work" [level=2] [ref=f2e151]
            - paragraph [ref=f2e152]:
              - text: Three view modes—Verbose, Normal, and Summary—let you dial the interface from full transparency into Claude's tool calls to just the results. New keyboard shortcuts cover session switching, spawning, and navigation; press
              - code [ref=f2e153]: ⌘ + /
              - text: (or
              - code [ref=f2e154]: Ctrl + /
              - text: ) to see the full list. A new usage button shows both your context window and session usage at a glance.
            - paragraph [ref=f2e155]: Under the hood, the app has been rebuilt for reliability and speed, and now streams responses as Claude generates them.
            - heading "Getting started" [level=2] [ref=f2e156]
            - paragraph [ref=f2e157]: The redesigned desktop app is available now for all Claude Code users on Pro, Max, Team, and Enterprise plans, and via the Claude API.
            - paragraph [ref=f2e158]:
              - link "Download the app" [ref=f2e159] [cursor=pointer]:
                - /url: https://claude.com/download
              - text: ", or update and restart if you already have it. Explore the"
              - link "documentation" [ref=f2e160] [cursor=pointer]:
                - /url: https://docs.claude.com/claude-code
              - text: to learn more.

              - heading "Redesigning Claude Code on desktop for parallel agents" [level=1] [ref=f2e74]
              - paragraph [ref=f2e76]: Today, we're releasing a redesign of the Claude Code desktop app, built to help you run more Claude Code tasks at once.
              - group [ref=f2e77]:
                - link "Download app" [ref=f2e78] [cursor=pointer]:
                  - /url: https://claude.com/download
